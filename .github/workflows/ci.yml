name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (Contract, Types, Lint, Test, Build, Size)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Contract equality check
        run: bun run contract:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # tests/security/proxy-boundary.test.ts scans dist/, so the build comes
      # first. The size check runs before the tests because the QA harness test
      # (tests/harness/cleanup.test.ts) rebuilds dist/ under NODE_ENV=test.
      - name: Production build
        run: bun run build

      - name: Size check
        run: bun run size:check

      - name: Test
        run: bun test
