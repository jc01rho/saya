[project]
name = "hinokami-kagura"
version = "0.0.0"
description = "kanao-cli / kamado-cli 를 HTTP+SSE로 감싸는 외부 래퍼 — 코어를 spawn만 하고 복호화 키를 쥐지 않는다"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
# 의존성 0개는 이 저장소의 성질입니다. 표준 라이브러리만 쓰세요.
dependencies = []

[project.scripts]
hinokami-kagura = "hinokami_kagura.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hinokami_kagura*"]

[tool.pyright]
include = ["hinokami_kagura", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
